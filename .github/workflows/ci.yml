name: state_bench CI

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: Compile + O1 equivalence tests + pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter --version
      - run: flutter create . --platforms=android --project-name state_bench && rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded --timeout 90s
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy scipy pandas matplotlib
      - run: cd analysis && python -m unittest -v test_pipeline

  pilot-emulator:
    name: Pilot run on Android emulator (pipeline readiness, not final data)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy scipy pandas matplotlib
      - run: flutter create . --platforms=android --project-name state_bench && rm -f test/widget_test.dart && flutter pub get
      - run: echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Run pilot matrix on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python tool/run_matrix.py --device emulator-5554 --device-class emulator --pilot
      - name: Analyse pilot
        if: always()
        run: python analysis/analyze.py results/pilot || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-results-emulator
          path: results/
