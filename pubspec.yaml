name: state_bench
description: >-
  Controlled testbed for comparing the BLoC and Riverpod state management
  architectures in Flutter under high-frequency state updates
  (Assignment 3, Ashkenov N. & Orazbek U., SE-2406).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

# Versions are pinned (no caret) so that every run uses exactly the same
# library code. pubspec.lock must be committed together with the results.
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_riverpod: 2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
